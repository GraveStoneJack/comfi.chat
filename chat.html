<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfiChat - Chat Room</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <div class="logout-container">
            <button id="logout-btn" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
        <div class="user-list">
            <div class="tabs">
                <button class="tab-btn active" data-tab="online">Online (<span id="online-count">0</span>)</button>
                <button class="tab-btn" data-tab="chats">Chats (<span id="chats-count">0</span>)</button>
            </div>
            <div class="tab-content active" id="online-tab">
                <div class="filter-section">
                    <select id="gender-filter">
                        <option value="all">All Genders</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                    <select id="country-filter">
                        <option value="all">All Countries</option>
                        <!-- Countries will be populated dynamically -->
                    </select>
                    <div class="age-filter">
                        <select id="age-min">
                            <option value="">Min Age</option>
                            <!-- Options will be populated dynamically -->
                        </select>
                        <select id="age-max">
                            <option value="">Max Age</option>
                            <!-- Options will be populated dynamically -->
                        </select>
                    </div>
                    <div class="filter-buttons">
                        <button id="apply-filters">Apply Filters</button>
                        <button id="clear-filters">Clear Filters</button>
                    </div>
                </div>
                <div id="online-users">
                    <!-- Online users will be populated here -->
                </div>
            </div>
            <div class="tab-content" id="chats-tab">
                <!-- Active chats will be populated here -->
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-header">
                <h2 id="chat-user-name"></h2>
                <div class="user-info">
                    <span id="chat-user-age"></span> |
                    <img id="chat-user-flag" src="" alt="" class="flag-icon">
                    <span id="chat-user-country"></span>
                </div>
            </div>
            <div class="default-state">
                <div class="default-message">
                    <i class="fas fa-comments"></i>
                    <h2>Welcome to ComfiChat</h2>
                    <p>Select a user from the list to start chatting</p>
                </div>
            </div>
            <div class="chat-actions">
                <button id="block-user-btn" class="action-btn">Block</button>
                <button id="report-user-btn" class="action-btn">Report</button>
            </div>
            <div class="messages">
                <div class="messages-fade"></div>
                <!-- Messages will be populated here -->
            </div>
            <div class="message-input">
                <button id="attach-file-btn" class="attach-btn">
                    <i class="fas fa-paperclip"></i>
                </button>
                <button id="inline-search-btn" class="search-icon-btn" aria-label="Search">
                    <i class="fas fa-magnifying-glass"></i>
                </button>
                <input type="text" id="message-text" placeholder="Type your message...">
                <button id="send-btn">Send</button>
                <div class="search-slide" id="search-slide">
                    <i class="fas fa-magnifying-glass" style="color:#9b4dca;"></i>
                    <input type="text" id="message-search-input" placeholder="Search in conversation...">
                    <button class="search-icon-btn" id="inline-search-close" aria-label="Close" style="width:28px;height:28px;background:rgba(155,77,202,0.15);color:#9b4dca;"><i class="fas fa-xmark"></i></button>
                    <div class="search-results" id="search-results"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="chat.js"></script>
    <div id="report-popup">
        <h3>Report User</h3>
        <form id="report-form">
            <label>
                <input type="radio" name="report-reason" value="harassment" required>
                Harassment
            </label>
            <label>
                <input type="radio" name="report-reason" value="spam" required>
                Spam
            </label>
            <label>
                <input type="radio" name="report-reason" value="inappropriate-content" required>
                Inappropriate Content
            </label>
            <label>
                <input type="radio" name="report-reason" value="other" required>
                Other
            </label>
            <textarea id="additional-info" placeholder="Additional information (optional)"></textarea>
            <div class="popup-actions">
                <button type="button" onclick="document.getElementById('report-popup').style.display='none';">Cancel</button>
                <button type="submit">Submit Report</button>
            </div>
        </form>
    </div>
    <!-- Image Lightbox Preview -->
    <div id="image-lightbox" class="lightbox" style="display:none;">
        <div class="lightbox-overlay"></div>
        <div class="lightbox-body">
            <img id="lightbox-img" src="" alt="Preview">
        </div>
    </div>

    <!-- Image Send Settings -->
    <div id="image-settings" class="popup" style="display:none;">
        <div class="popup-content">
            <h3>Send Photo</h3>
            <div class="preference-item">
                <label>Visibility duration</label>
                <select id="image-expiry">
                    <option value="0">Forever</option>
                    <option value="2">2 seconds</option>
                    <option value="5">5 seconds</option>
                    <option value="10">10 seconds</option>
                    <option value="15">15 seconds</option>
                    <option value="20">20 seconds</option>
                    <option value="30">30 seconds</option>
                    <option value="40">40 seconds</option>
                    <option value="50">50 seconds</option>
                    <option value="60">60 seconds</option>
                </select>
            </div>
            <div class="popup-actions">
                <button type="button" id="image-cancel">Cancel</button>
                <button type="button" id="image-send" class="submit-btn">Send</button>
            </div>
        </div>
    </div>
    <div id="preferences-popup" class="popup">
        <div class="popup-content">
            <h3>Chat Preferences</h3>
            <div class="preference-item">
                <label>
                    <input type="checkbox" id="notifications-toggle">
                    Enable Notifications
                </label>
            </div>
            <div class="preference-item">
                <label>
                    <input type="checkbox" id="sound-toggle">
                    Enable Sound
                </label>
            </div>
            <div class="preference-item">
                <label>Theme</label>
                <select id="theme-select">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
            <div class="preference-item">
                <label>Font Size</label>
                <select id="font-size-select">
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>
            </div>
            <button id="save-preferences" class="submit-btn">Save Preferences</button>
        </div>
    </div>
</body>
</html>
