<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ComfiChat">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#9b4dca" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#2f0642" media="(prefers-color-scheme: dark)">
    <meta name="format-detection" content="telephone=no">
    <title>ComfiChat - Anonymous Chat Rooms to Talk to Strangers Online</title>
    <meta name="description" content="ComfiChat is a free online chat site for anonymous chat rooms, random conversations, and talking to strangers in a simple live chat experience.">
    <meta name="keywords" content="chat site, chat, anonymous chat, talk to strangers, chat rooms, online chat, random chat, stranger chat">
    <link rel="canonical" href="https://comfi.chat/">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ComfiChat">
    <meta property="og:title" content="ComfiChat - Anonymous Chat Rooms to Talk to Strangers Online">
    <meta property="og:description" content="Meet new people in anonymous chat rooms and start live conversations with strangers online.">
    <meta property="og:url" content="https://comfi.chat/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="ComfiChat - Anonymous Chat Rooms">
    <meta name="twitter:description" content="A simple online chat site for anonymous chat, chat rooms, and talking to strangers.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:,">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="theme-toggle">
        <button id="theme-toggle-btn" class="theme-toggle-btn"><i class="fas fa-circle-half-stroke"></i> Auto</button>
    </div>
    <div class="container">
        <div id="back-btn-container" style="display: none;">
            <button id="back-btn" class="back-btn">Back</button>
        </div>
        <header>
            <h1>ComfiChat</h1>
            <p>Anonymous chat rooms for meeting new people and talking to strangers online.</p>
        </header>
        <main>
            <section class="auth-section">
                <h2>Join a Live Chat</h2>
                <div class="auth-options">
                    <button class="auth-btn google-btn">
                        <i class="fab fa-google"></i> Sign up with Google
                    </button>
                    <button class="auth-btn apple-btn">
                        <i class="fab fa-apple"></i> Sign up with Apple
                    </button>
                    <button class="auth-btn email-btn">
                        <i class="far fa-envelope"></i> Sign up with Email
                    </button>
                    <a href="/login" class="auth-btn signin-btn">
                        <i class="fas fa-right-to-bracket"></i> Sign in with Email
                    </a>
                </div>
                <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
                <p class="or-divider">or</p>
                <a href="#" class="talk-strangers-btn">Talk to Strangers</a>
            </section>
        </main>
        <footer>
            <p>&copy; 2025 ComfiChat. All rights reserved.</p>
            <div class="footer-links">
                <a href="/about.html" class="footer-link">About</a>
                <a href="/terms.html" class="footer-link">Terms of Use</a>
                <a href="/privacy.html" class="footer-link">Privacy Policy</a>
            </div>
        </footer>
    </div>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ComfiChat",
        "url": "https://comfi.chat/",
        "description": "A free online chat site for anonymous chat rooms and talking to strangers."
    }
    </script>
    <script src="script.js"></script>
</body>
</html>
