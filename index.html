<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CozyPal - Sophisticated Chat Experience</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:,">
    <link rel="canonical" href="https://comfi.chat/">
    <meta name="robots" content="index,follow">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="theme-toggle">
        <button id="theme-toggle-btn" class="theme-toggle-btn"><i class="fas fa-circle-half-stroke"></i> Auto</button>
    </div>
    <div class="container">
        <div id="back-btn-container" style="display: none;">
            <button id="back-btn" class="back-btn">Back</button>
        </div>
        <header>
            <h1>ComfiChat</h1>
            <p>Experience a sophisticated chat like never before</p>
        </header>
        <main>
            <section class="auth-section">
                <h2>Join the Conversation</h2>
                <div class="auth-options">
                    <button class="auth-btn google-btn">
                        <i class="fab fa-google"></i> Sign up with Google
                    </button>
                    <button class="auth-btn apple-btn">
                        <i class="fab fa-apple"></i> Sign up with Apple
                    </button>
                    <button class="auth-btn email-btn">
                        <i class="far fa-envelope"></i> Sign up with Email
                    </button>
                </div>
                <p class="or-divider">or</p>
                <a href="#" class="talk-strangers-btn">Talk to Strangers</a>
            </section>
        </main>
        <footer>
            <p>&copy; 2025 ComfiChat. All rights reserved.</p>
            <div class="footer-links">
                <a href="#" class="footer-link" id="about-link">About</a>
                <a href="#" class="footer-link" id="terms-link">Terms of Use</a>
                <a href="#" class="footer-link" id="privacy-link">Privacy Policy</a>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
