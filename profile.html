<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ComfiChat">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#9b4dca" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#2f0642" media="(prefers-color-scheme: dark)">
    <title>ComfiChat - Create Your Profile</title>
    <link rel="canonical" href="https://comfi.chat/profile.html">
    <meta name="robots" content="noindex,follow">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:,">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .profile-wrapper { width: 100%; display: flex; justify-content: center; }
        .profile-surface {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(240, 230, 255, 0.9) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(47, 6, 66, 0.3), 0 0 60px rgba(215, 154, 255, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 24px;
            width: 92%;
            max-width: 1100px;
        }
        body.dark .profile-surface {
            background: linear-gradient(135deg, rgba(30,30,30,0.9) 0%, rgba(20,20,20,0.9) 100%);
            border-color: rgba(255,255,255,0.1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.55), 0 0 80px rgba(0,0,0,0.28), inset 0 0 20px rgba(255,255,255,0.04);
        }
        .profile-header { text-align: center; margin-bottom: 16px; }
        .profile-grid { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
        .profile-card { background: rgba(255,255,255,0.65); border-radius: 14px; padding: 14px; border: 1px solid rgba(59,3,55,0.15); }
        body.dark .profile-card { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
        .avatar { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: #fafafa; }
        .file-input { display: none; }
        .upload-btn { width: 100%; margin-top: 10px; }
        .remove-photo-btn { width: 100%; margin-top: 8px; color: #c2414b; border-color: rgba(238,82,83,0.38); background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(255,235,238,0.95) 100%); }
        .remove-photo-btn:hover { background: linear-gradient(135deg, #fff 0%, #ffe4e8 100%); box-shadow: 0 12px 26px rgba(238,82,83,0.18); }
        body.dark .remove-photo-btn { color: #ffb4bd; border-color: rgba(255,128,140,0.35); background: rgba(238,82,83,0.12); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(59,3,55,0.15); background: rgba(255,255,255,0.75); color: inherit; }
        body.dark .form-group input, body.dark .form-group select, body.dark .form-group textarea { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.12); }
        /* Ensure multi-select looks correct in dark mode */
        .form-group select[multiple] { min-height: 110px; }
        .form-group select[multiple] option { background-color: transparent; color: inherit; }
        body.dark .form-group select[multiple] { background: rgba(255,255,255,0.08); color: #e8e1ee; }
        body.dark .form-group select[multiple] option { background-color: rgba(255,255,255,0.06); color: #e8e1ee; }
        .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
        .btn-secondary {
            background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(243,229,255,0.95) 100%);
            color: #7c2bb2;
            border: 1px solid rgba(155,77,202,0.45);
            padding: 12px 18px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(155,77,202,0.18);
            transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease, opacity 0.14s ease;
        }
        .btn-secondary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(155,77,202,0.24);
            background: linear-gradient(135deg, #fff 0%, #efd9ff 100%);
        }
        .btn-secondary:active,
        .btn-secondary.is-busy {
            transform: translateY(1px) scale(0.98);
            box-shadow: inset 0 3px 8px rgba(47,6,66,0.16), 0 4px 12px rgba(155,77,202,0.14);
        }
        .btn-secondary.is-busy {
            opacity: 0.8;
            pointer-events: none;
        }
        body.dark .btn-secondary {
            color: #f0ddff;
            border-color: rgba(215,154,255,0.42);
            background: linear-gradient(135deg, rgba(80,54,96,0.96) 0%, rgba(79,34,112,0.88) 100%);
            box-shadow: 0 8px 20px rgba(0,0,0,0.28);
        }
        body.dark .btn-secondary:hover { background: linear-gradient(135deg, rgba(96,65,116,0.98) 0%, rgba(96,45,135,0.92) 100%); }
        .hidden { display: none !important; }
        .profile-view { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 20px; align-items: stretch; }
        .profile-photo-stage { position: relative; min-height: 520px; border-radius: 22px; overflow: hidden; background: rgba(59,3,55,0.08); border: 1px solid rgba(59,3,55,0.12); }
        .profile-photo-stage img { width: 100%; height: 100%; min-height: 520px; object-fit: cover; display: block; }
        .profile-photo-fallback { height: 100%; min-height: 520px; display: flex; align-items: center; justify-content: center; font-size: 84px; font-weight: 800; color: white; background: linear-gradient(135deg, #d79aff 0%, #7c3aed 100%); }
        .gallery-nav { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; pointer-events: none; padding: 12px; }
        .gallery-nav button { pointer-events: auto; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.75); color: #3b0337; cursor: pointer; box-shadow: 0 6px 18px rgba(47,6,66,0.18); }
        .profile-thumbnails { position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; gap: 8px; overflow-x: auto; padding: 8px; border-radius: 16px; background: rgba(255,255,255,0.68); backdrop-filter: blur(8px); }
        .profile-thumbnails button { width: 54px; height: 54px; border-radius: 12px; border: 2px solid transparent; padding: 0; overflow: hidden; cursor: pointer; flex: 0 0 auto; background: rgba(155,77,202,0.15); }
        .profile-thumbnails button.active { border-color: #9b4dca; }
        .profile-thumbnails img { width: 100%; height: 100%; min-height: 0; object-fit: cover; }
        .profile-readonly-card { display: flex; flex-direction: column; gap: 18px; }
        .profile-name-row { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
        .profile-name-row h2 { font-size: clamp(2rem, 5vw, 4rem); margin: 0; line-height: 1; }
        .profile-username { color: #8a5ba3; font-weight: 700; }
        .profile-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .profile-chip { display: inline-flex; padding: 8px 12px; border-radius: 999px; background: rgba(155,77,202,0.12); color: #3b0337; font-weight: 700; }
        .profile-detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .profile-detail { padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.62); border: 1px solid rgba(59,3,55,0.1); }
        .profile-detail span { display: block; color: #8a5ba3; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
        .profile-gallery-empty { padding: 16px; border: 1px dashed rgba(155,77,202,0.35); border-radius: 14px; color: #6b4b74; }
        .gallery-manager { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(59,3,55,0.12); }
        .gallery-upload-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; }
        .gallery-editor-item { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: rgba(155,77,202,0.12); }
        .gallery-editor-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .gallery-editor-item button { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(238,82,83,0.92); color: #fff; cursor: pointer; }
        body.dark .profile-photo-stage { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
        body.dark .gallery-nav button, body.dark .profile-thumbnails { background: rgba(20,20,20,0.72); color: #fff; }
        body.dark .profile-chip { background: rgba(215,154,255,0.16); color: #f3e7ff; }
        body.dark .profile-detail { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
        body.dark .profile-username, body.dark .profile-detail span, body.dark .profile-gallery-empty { color: #d9b8ff; }
        @media (max-width: 900px) { .profile-grid, .profile-view, .profile-detail-grid { grid-template-columns: 1fr; } .profile-photo-stage, .profile-photo-stage img, .profile-photo-fallback { min-height: 420px; } }
    </style>
    <link rel="preconnect" href="https://flagcdn.com">
    <link rel="dns-prefetch" href="https://flagcdn.com">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const THEME_KEY = 'comfi.theme';
            const themeBtn = document.getElementById('theme-toggle-btn');
            function getSystemPref() { return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
            function applyTheme(mode) { const resolved = mode === 'auto' ? getSystemPref() : mode; document.body.classList.toggle('dark', resolved === 'dark'); if (themeBtn) themeBtn.innerHTML = `<i class="fas ${resolved === 'dark' ? 'fa-moon' : 'fa-sun'}"></i> ${mode === 'auto' ? 'Auto' : (resolved === 'dark' ? 'Dark' : 'Light')}`; }
            let themeMode = localStorage.getItem(THEME_KEY) || 'auto';
            applyTheme(themeMode);
            if (themeBtn) themeBtn.addEventListener('click', () => { themeMode = themeMode === 'auto' ? 'light' : (themeMode === 'light' ? 'dark' : 'auto'); localStorage.setItem(THEME_KEY, themeMode); applyTheme(themeMode); });
        });
    </script>
</head>
<body>
    <div class="theme-toggle">
        <button id="theme-toggle-btn" class="theme-toggle-btn"><i class="fas fa-circle-half-stroke"></i> Auto</button>
    </div>
    <div class="profile-wrapper">
      <div class="profile-surface">
        <header class="profile-header">
            <h1 id="profile-title">Loading profile...</h1>
            <p id="profile-subtitle">Preparing your profile view.</p>
        </header>
        <section id="profile-view" class="profile-view hidden" aria-live="polite">
            <div class="profile-photo-stage">
                <img id="view-photo" alt="Profile photo">
                <div id="view-photo-fallback" class="profile-photo-fallback hidden">C</div>
                <div class="gallery-nav">
                    <button id="gallery-prev" type="button" aria-label="Previous photo"><i class="fas fa-chevron-left"></i></button>
                    <button id="gallery-next" type="button" aria-label="Next photo"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div id="profile-thumbnails" class="profile-thumbnails"></div>
            </div>
            <div class="profile-card profile-readonly-card">
                <div class="profile-name-row">
                    <div>
                        <span id="view-username" class="profile-username"></span>
                        <h2 id="view-display-name">Your profile</h2>
                    </div>
                    <button id="edit-profile-btn" class="submit-btn" type="button"><i class="fas fa-pen"></i> Edit</button>
                </div>
                <div id="view-chips" class="profile-chip-row"></div>
                <div id="view-looking-for" class="profile-chip-row"></div>
                <div id="view-hobbies" class="profile-chip-row"></div>
                <div class="profile-detail-grid">
                    <div class="profile-detail"><span>Hair</span><strong id="view-hair"></strong></div>
                    <div class="profile-detail"><span>Eyes</span><strong id="view-eyes"></strong></div>
                    <div class="profile-detail"><span>Ethnicity</span><strong id="view-ethnicity"></strong></div>
                    <div class="profile-detail"><span>Transgender</span><strong id="view-transgender"></strong></div>
                </div>
                <p id="view-gallery-empty" class="profile-gallery-empty hidden">No gallery photos yet. Add photos in edit mode so people can browse them.</p>
                <div class="actions">
                    <button type="button" id="view-back-chat" class="btn-secondary">Back to chat</button>
                    <a id="view-public-link" class="btn-secondary" href="#" target="_blank" rel="noopener">Public link</a>
                </div>
            </div>
        </section>
        <div class="profile-grid hidden" id="profile-editor">
            <div class="profile-card">
                <img id="avatar" class="avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400' viewBox='0 0 400 400'><defs><linearGradient id='g' x1='0' x2='1' y1='0' y2='1'><stop stop-color='%23f5efff' offset='0'/><stop stop-color='%23efe6ff' offset='1'/></linearGradient></defs><rect width='400' height='400' fill='url(%23g)'/><circle cx='200' cy='150' r='70' fill='%23d3c6f3'/><path d='M80 320c20-70 90-90 120-90s100 20 120 90' fill='%23d3c6f3'/></svg>" alt="Profile picture placeholder">
                <input id="file-input" class="file-input" type="file" accept="image/*">
                <button id="upload-btn" class="submit-btn upload-btn"><i class="fas fa-upload"></i> Upload Photo</button>
                <button id="remove-avatar-btn" class="btn-secondary remove-photo-btn" type="button"><i class="fas fa-trash"></i> Remove Photo</button>
                <small id="upload-hint">Max 5MB. PNG, JPG, GIF, WEBP.</small>
                <div class="gallery-manager">
                    <div class="gallery-upload-row">
                        <strong>Profile gallery</strong>
                        <small><span id="gallery-count">0</span>/10 photos</small>
                    </div>
                    <input id="gallery-file-input" class="file-input" type="file" accept="image/*" multiple>
                    <button id="gallery-upload-btn" class="btn-secondary" type="button"><i class="fas fa-images"></i> Add photos</button>
                    <div id="gallery-editor-grid" class="gallery-grid"></div>
                </div>
            </div>
            <div class="profile-card">
                <form id="profile-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input id="username" type="text" required minlength="3" maxlength="30" placeholder="username">
                        </div>
                        <div class="form-group">
                            <label for="displayName">Display name</label>
                            <input id="displayName" type="text" required maxlength="50" placeholder="How others see you">
                        </div>
                    </div>
                    <div class="form-row">
                        <!-- Email/password removed from profile step. Users verify first. -->
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="age">Age</label>
                            <select id="age" required></select>
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select id="gender" required>
                                <option value="">Select</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="non-binary">Non-binary</option>
                                <option value="genderfluid">Genderfluid</option>
                                <option value="agender">Agender</option>
                                <option value="demiboy">Demiboy</option>
                                <option value="demigirl">Demigirl</option>
                                <option value="other">Other</option>
                                <option value="prefer-not-to-say">Prefer not to say</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="transgender">Transgender</label>
                            <select id="transgender">
                                <option value="">Select</option>
                                <option value="yes">Yes</option>
                                <option value="no">No</option>
                                <option value="prefer-not-to-say">Prefer not to say</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="sexuality">Sexuality</label>
                            <select id="sexuality" required>
                                <option value="">Select</option>
                                <option value="straight">Straight</option>
                                <option value="gay">Gay</option>
                                <option value="lesbian">Lesbian</option>
                                <option value="bisexual">Bisexual</option>
                                <option value="pansexual">Pansexual</option>
                                <option value="questioning">Questioning</option>
                                <option value="asexual">Asexual</option>
                                <option value="other">Other</option>
                                <option value="prefer-not-to-say">Prefer not to say</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="lookingFor">Looking for</label>
                            <select id="lookingFor" multiple>
                                <option value="friendship">Friendship</option>
                                <option value="dating">Dating</option>
                                <option value="relationship">Relationship</option>
                                <option value="casual">Casual</option>
                                <option value="networking">Networking</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="hairType">Hair type</label>
                            <select id="hairType">
                                <option value="">Select</option>
                                <option value="straight">Straight</option>
                                <option value="wavy">Wavy</option>
                                <option value="curly">Curly</option>
                                <option value="coily">Coily</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="hairColor">Hair color</label>
                            <select id="hairColor">
                                <option value="">Select</option>
                                <option value="black">Black</option>
                                <option value="brown">Brown</option>
                                <option value="blonde">Blonde</option>
                                <option value="red">Red</option>
                                <option value="grey">Grey</option>
                                <option value="white">White</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="eyeColor">Eye color</label>
                            <select id="eyeColor">
                                <option value="">Select</option>
                                <option value="brown">Brown</option>
                                <option value="blue">Blue</option>
                                <option value="green">Green</option>
                                <option value="hazel">Hazel</option>
                                <option value="grey">Grey</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="ethnicity">Ethnicity</label>
                            <select id="ethnicity">
                                <option value="">Select</option>
                                <option value="african-black">African / Black</option>
                                <option value="arab">Arab</option>
                                <option value="central-asian">Central Asian</option>
                                <option value="east-asian">East Asian</option>
                                <option value="south-asian">South Asian</option>
                                <option value="middle-eastern-west-asian">Middle Eastern / West Asian</option>
                                <option value="latino-hispanic">Latino / Hispanic</option>
                                <option value="native-american">Native American</option>
                                <option value="pacific-islander">Pacific Islander</option>
                                <option value="white-european">White / European</option>
                                <option value="mixed-multiracial">Mixed / Multiracial</option>
                                <option value="other">Other</option>
                                <option value="prefer-not-to-say">Prefer not to say</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="hobbies">Hobbies (comma separated)</label>
                        <input id="hobbies" type="text" placeholder="music, travel, fitness">
                    </div>
                    <div class="actions">
                        <button type="button" id="go-chat" class="btn-secondary">Back to chat</button>
                        <button type="submit" id="save-profile" class="submit-btn">Save & Continue</button>
                    </div>
                </form>
            </div>
        </div>
      </div>
    </div>
    <script src="profile.js"></script>
</body>
</html>
