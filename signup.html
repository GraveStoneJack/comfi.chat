<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ComfiChat">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#9b4dca" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#2f0642" media="(prefers-color-scheme: dark)">
    <title>ComfiChat Sign Up - Join Online Chat Rooms</title>
    <meta name="description" content="Create a ComfiChat account to join online chat rooms, meet new people, and start live conversations with strangers.">
    <link rel="canonical" href="https://comfi.chat/signup.html">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="theme-toggle">
        <button id="theme-toggle-btn" class="theme-toggle-btn"><i class="fas fa-circle-half-stroke"></i> Auto</button>
    </div>
    <div class="container" style="max-width:520px;">
        <header>
            <h1>Create your account</h1>
            <p>Use email and set a password. We’ll verify your email.</p>
        </header>
        <main>
            <form id="signup-form" style="display:flex;flex-direction:column;gap:14px;">
                <input id="email" type="email" placeholder="Email" required>
                <input id="password" type="password" placeholder="Password (min 6)" minlength="6" required>
                <button class="submit-btn" type="submit">Send verification</button>
            </form>
            <div id="signup-note" style="margin-top:10px;font-size:14px;opacity:0.8;"></div>
            <p class="auth-switch" style="margin-top:18px;">Already have an account? <a href="/login">Sign in</a></p>
        </main>
    </div>
    <script>
    const API_URL = 'https://luxeonchat-backend.onrender.com';
    document.addEventListener('DOMContentLoaded', () => {
        const themeBtn = document.getElementById('theme-toggle-btn');
        const THEME_KEY = 'comfi.theme';
        const getSystemPref = () => (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        const applyTheme = (mode) => { const resolved = mode === 'auto' ? getSystemPref() : mode; document.body.classList.toggle('dark', resolved === 'dark'); if (themeBtn) themeBtn.innerHTML = `<i class="fas ${resolved === 'dark' ? 'fa-moon' : 'fa-sun'}"></i> ${mode === 'auto' ? 'Auto' : (resolved === 'dark' ? 'Dark' : 'Light')}`; };
        let themeMode = localStorage.getItem(THEME_KEY) || 'auto';
        applyTheme(themeMode);
        themeBtn?.addEventListener('click', () => { themeMode = themeMode === 'auto' ? 'light' : (themeMode === 'light' ? 'dark' : 'auto'); localStorage.setItem(THEME_KEY, themeMode); applyTheme(themeMode); });

        const form = document.getElementById('signup-form');
        const note = document.getElementById('signup-note');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(`${API_URL}/api/auth/email/signup`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) { alert(data.error || 'Failed to start signup'); return; }
                note.textContent = 'Check your email for a verification link.' + (data.preview ? ` (Preview: ${data.preview})` : '');
            } catch (err) {
                alert('Failed to start signup');
            }
        });
    });
    </script>
    </body>
    </html>
